algorithm: multiclass_rankup
save_dir: ./saved_models/classic_cv
save_name: multiclass_rankup_utkface_lb250_s2_ordinal
resume: True
load_path: ./saved_models/classic_cv/multiclass_rankup_utkface_lb250_s2_ordinal/latest_model.pth
overwrite: True

use_tensorboard: False 
use_wandb: True
wandb_mode: online #offline 
wandb_online_logging: 
  project: DD2610Project
  name: classic_cv_multiclass_rankup_utkface_lb250_s2_ordinal

# Additional parameters for multiclass_rankup
num_classes: 8 
ordinal_ranking: True
# choose binning strategy: "equal_width" or "quantile" (equal frequency bins)
# quantile not working because of small labeled dataset size, so it is disabled for now
bin_strategy: equal_width

use_aim: False
# Quick test settings (reduce for faster testing)
epoch: 256
num_train_iter: 262144
num_eval_iter: 1024
num_log_iter: 256

num_labels: 250
batch_size: 32
eval_batch_size: 256
ema_m: 0.999
uratio: 7
arc_loss_ratio: 0.2
arc_ulb_loss_ratio: 1.0
hard_label: True
T: 0.5
p_cutoff: 0.95
optim: SGD
lr: 0.01
momentum: 0.9
weight_decay: 0.001
layer_decay: 1.0
amp: False
clip_grad: 0.0
use_cat: True
criterion: l1
net: wrn_28_2
net_from_name: False
data_dir: ./data
dataset: utkface
train_sampler: RandomSampler
num_workers: 4 # set to 0 for windows as there is multi-processor issue 4
crop_ratio: 0.875
img_size: 40
preload: False
seed: 2
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10002
dist_backend: nccl
