algorithm: mixmatch
save_dir: ./saved_models/crowd_cv
save_name: mixmatch_crowd_lb250_s1
resume: True
load_path: ./saved_models/crowd_cv/mixmatch_crowd_lb250_s1/latest_model.pth
overwrite: True
use_tensorboard: False
use_wandb: True
wandb_mode: online #offline 

wandb_online_logging: 
  project: DD2610Project
  name: crowd_cv_mixmatch_lb250_s1

use_aim: False
epoch: 100
num_train_iter: 262144
num_eval_iter: 1024
num_log_iter: 256
num_labels: 250
batch_size: 32
eval_batch_size: 256
ema_m: 0.999
uratio: 1
ulb_loss_ratio: 0.1
unsup_warm_up: 0.4
mixup_alpha: 0.5
optim: SGD
lr: 0.01
momentum: 0.9
weight_decay: 0.001
layer_decay: 1.0
amp: False
clip_grad: 0.0
use_cat: True
criterion: l1
net: wrn_28_2
net_from_name: False
data_dir: ./data
dataset: crowd_counting
train_sampler: RandomSampler
num_workers: 4
crop_ratio: 0.875
img_size: 40
preload: False
seed: 1
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10002
dist_backend: nccl
