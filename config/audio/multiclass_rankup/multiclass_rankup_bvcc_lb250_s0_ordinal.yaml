algorithm: multiclass_rankup
save_dir: ./saved_models/audio
save_name: multiclass_rankup_bvcc_lb250_s0_ordinal
resume: True
load_path: ./saved_models/audio/multiclass_rankup_bvcc_lb250_s0_ordinal/latest_model.pth
overwrite: True
use_tensorboard: False 
use_wandb: True 
wandb_mode: online #offline 

wandb_online_logging: 
  project: DD2610Project
  name: audio_multiclass_rankup_bvcc_lb250_s0_ordinal


# Additional parameters for multiclass_rankup
num_classes: 5
ordinal_ranking: True
# choose binning strategy: "equal_width" or "quantile" (equal frequency bins)
# quantile not working because of small labeled dataset size, so it is disabled for now
bin_strategy: equal_width


use_aim: False
epoch: 100
num_train_iter: 102400
num_eval_iter: 1024
num_log_iter: 256
num_warmup_iter: 5120
num_labels: 250
batch_size: 8
eval_batch_size: 16
ema_m: 0.0
uratio: 1
arc_loss_ratio: 0.2
arc_ulb_loss_ratio: 1.0
hard_label: True
T: 0.5
p_cutoff: 0.95
optim: AdamW
lr: 2e-06
momentum: 0.9
weight_decay: 2e-05
layer_decay: 0.75
amp: False
clip_grad: 0.0
use_cat: False
criterion: l1
net: whisper_base
net_from_name: False
use_pretrain: True
pretrain_path: openai/whisper-base
data_dir: ./data
dataset: bvcc
train_sampler: RandomSampler
num_workers: 2 # set to 0 for windows as there is multi-processor issue 2
max_length_seconds: 6.0
sample_rate: 16000
preload: True
seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10001
dist_backend: nccl
